<body class="home">

    <main>
        <!-- Destaque imagem tela inicial -->
        <div class="login-box container">

            <h1 class="titulo_flash">Flash Finance</h1>
            <h2>Bem-Vindo</h2>

            <p>Criar Conta</p>
            <p>Preencha os dados para começar</p>
            

            <form action="">
                <input type="text" placeholder="Nome completo" required>

                <input type="password" placeholder="Senha" required>
                <button type="submit" class="fundo-gradiente hover-laranja">Cadastrar</button>
            </form>
            
            <p>Já tem uma conta? <a href="login.html" class="hover-color pb-3">Entrar</a></p>
